# Blueprint для деплоя на Render.com (бесплатный тариф).
# Секреты (ключи и ссылки) задаются в панели Render, а не здесь.
services:
  - type: web
    name: realestate-ai-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: MODEL_ID
        sync: false
      - key: LEAD_WEBHOOK_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
